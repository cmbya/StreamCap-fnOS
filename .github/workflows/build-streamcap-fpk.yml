name: Build StreamCap fnOS FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选：手动指定 StreamCap 版本，例如 v1.0.3；留空则使用上游最新正式版"
        required: false
        type: string

  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取目标版本
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_VERSION:-}" ]; then
            TAG="$MANUAL_VERSION"
            case "$TAG" in
              v*) ;;
              *) TAG="v$TAG" ;;
            esac
          else
            TAG="$(python3 - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              'https://api.github.com/repos/ihmily/StreamCap/releases/latest',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'StreamCap-fnOS-builder'
              }
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              print(json.load(r)['tag_name'])
          PY
          )"
          fi

          VERSION="${TAG#v}"
          PACK_REV="$(tr -d '[:space:]' < PACK_REV)"
          RELEASE_TAG="fnos-${TAG}-${PACK_REV}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pack_rev=$PACK_REV" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "目标上游版本: $TAG"
          echo "飞牛封装版本: $PACK_REV"

      - name: 检查是否已经发布
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已经存在 $RELEASE_TAG，本次无需重复构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证上游标签存在
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          tag = os.environ['TAG']
          url = f'https://github.com/ihmily/StreamCap/archive/refs/tags/{tag}.tar.gz'

          req = urllib.request.Request(
              url,
              method='HEAD',
              headers={'User-Agent':'StreamCap-fnOS-builder'}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              print('上游源码标签可用:', tag, r.status)
          PY

      - name: 构建 x86 FPK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x ./scripts/build_fpk.sh
          ./scripts/build_fpk.sh "${{ steps.version.outputs.tag }}"

      - name: 上传 Actions 构建产物
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StreamCap-${{ steps.version.outputs.version }}-${{ steps.version.outputs.pack_rev }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: 创建 GitHub Pre-release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACK_REV: ${{ steps.version.outputs.pack_rev }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          自动检测到上游 StreamCap **${UPSTREAM_TAG}**，并生成 fnOS x86 原生 FPK。

          - 上游版本：${UPSTREAM_TAG}
          - fnOS 封装：${PACK_REV}
          - 架构：x86 / amd64
          - Docker：不使用
          - 升级：保留 StreamCap 持久化配置与录像目录

          这是自动构建的 Pre-release。
          建议先在飞牛上覆盖升级测试，确认录制正常后再改成正式版。
          EOF

          gh release create "$RELEASE_TAG" \
            dist/*.fpk dist/SHA256SUMS.txt \
            --title "StreamCap ${VERSION} fnOS x86 (${PACK_REV})" \
            --notes-file /tmp/release-notes.md \
            --prerelease
