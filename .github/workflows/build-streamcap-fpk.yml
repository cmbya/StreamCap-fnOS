name: Build StreamCap fnOS FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选：手动指定 StreamCap 版本，例如 v1.0.3；留空则使用上游最新正式版"
        required: false
        type: string

  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 验证 native7 定时录制生命周期补丁
        run: |
          set -euo pipefail
          python3 scripts/validate_native7_patch.py

      - name: 获取目标版本
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_VERSION:-}" ]; then
            TAG="$MANUAL_VERSION"

            case "$TAG" in
              v*) ;;
              *) TAG="v$TAG" ;;
            esac

            echo "手动指定上游版本: $TAG"
          else
            echo "自动获取 StreamCap 最新正式 Release..."

            # 不再请求 api.github.com。
            # GitHub Actions 共享出口 IP 很容易碰到
            # 未认证 REST API 的 60 次/小时限制。
            set +e

            LATEST_URL="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --retry 4 \
                --retry-delay 3 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 90 \
                --output /dev/null \
                --write-out '%{url_effective}' \
                'https://github.com/ihmily/StreamCap/releases/latest'
            )"

            CURL_EXIT=$?

            set -e

            if [ "$CURL_EXIT" -eq 0 ] && \
               [[ "$LATEST_URL" == */releases/tag/* ]]; then

              TAG="${LATEST_URL##*/}"
              echo "✅ 从 GitHub Release 跳转取得最新版本: $TAG"
            else
              echo "⚠️ Release 网页获取失败，改用 Git Tags 兜底"

              # 只接受 v数字.数字.数字 的正式版，
              # 自动排除 beta / rc / prerelease。
              TAG="$(
                git ls-remote \
                  --tags \
                  --refs \
                  https://github.com/ihmily/StreamCap.git \
                | awk '{print $2}' \
                | sed 's#refs/tags/##' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1
              )"

              if [ -z "$TAG" ]; then
                echo "❌ 无法取得 StreamCap 最新正式版本"
                exit 1
              fi

              echo "✅ 从 Git Tags 取得最新正式版本: $TAG"
            fi
          fi

          VERSION="${TAG#v}"
          PACK_REV="$(tr -d '[:space:]' < PACK_REV)"
          RELEASE_TAG="fnos-${TAG}-${PACK_REV}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pack_rev=$PACK_REV" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "目标上游版本: $TAG"
          echo "飞牛封装版本: $PACK_REV"

      - name: 检查是否已经发布
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "已经存在 $RELEASE_TAG，本次无需重复构建。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 验证上游标签存在
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          echo "验证上游 Tag: $TAG"

          if git ls-remote \
            --exit-code \
            --tags \
            --refs \
            https://github.com/ihmily/StreamCap.git \
            "refs/tags/$TAG" \
            >/dev/null; then

            echo "✅ 上游源码标签可用: $TAG"
          else
            echo "❌ 上游不存在 Tag: $TAG"
            exit 1
          fi

      - name: 构建 x86 FPK
        if: steps.existing.outputs.exists != 'true'
        run: |
          chmod +x ./scripts/build_fpk.sh
          ./scripts/build_fpk.sh "${{ steps.version.outputs.tag }}"

      - name: 上传 Actions 构建产物
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: StreamCap-${{ steps.version.outputs.version }}-${{ steps.version.outputs.pack_rev }}-fnOS-x86
          path: |
            dist/*.fpk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: 创建 GitHub Pre-release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PACK_REV: ${{ steps.version.outputs.pack_rev }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          自动检测到上游 StreamCap **${UPSTREAM_TAG}**，并生成 fnOS x86 原生 FPK。

          - 上游版本：${UPSTREAM_TAG}
          - fnOS 封装：${PACK_REV}
          - 架构：x86 / amd64
          - Docker：不使用
          - 升级：保留 StreamCap 持久化配置与录像目录

          这是自动构建的 Pre-release。
          建议先在飞牛上覆盖升级测试，确认录制正常后再改成正式版。
          EOF

          gh release create "$RELEASE_TAG" \
            dist/*.fpk dist/SHA256SUMS.txt \
            --title "StreamCap ${VERSION} fnOS x86 (${PACK_REV})" \
            --notes-file /tmp/release-notes.md \
            --prerelease
